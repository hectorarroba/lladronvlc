<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101010">
<meta name="description" content="LLADRÓN VLC — Vídeo inmersivo con microdrones FPV en Valencia. Discotecas, fiestas y eventos.">
<title>LLADRÓN VLC — Microdrone video / Valencia</title>
<style>
:root {
  --bg: #0b0b0e;
  --panel: #141419;
  --ink: #f2edf4;
  --muted: #8c8894;
  --line: #2d2938;
  --cyan: #4ce5ff;
  --pink: #ff3399;
  --orange: #ff5522;
  --acid: #d4ff33;
  --display: 'Arial Narrow', 'Helvetica Neue', sans-serif;
  --mono: 'JetBrains Mono', monospace;
  --page: 1240px;
}

*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:88px}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:Arial,Helvetica,sans-serif;
  overflow-x:hidden;
  position:relative;
}

/* Efecto Grano de Película y Desenfoque Analógico Lo-Fi */
body:before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:20;
  opacity:.15;
  background:repeating-linear-gradient(0deg,transparent 0 2px,rgba(255,255,255,.05) 3px,transparent 4px);
  mix-blend-mode:screen;
}
body:after{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:19;
  opacity:.18;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.4'/%3E%3C/svg%3E");
}

/* Halo luminoso reactivo al cursor */
.cursor-glow {
  position: fixed;
  width: 500px;
  height: 500px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255,51,153,0.18) 0%, rgba(76,229,255,0.12) 40%, transparent 70%);
  pointer-events: none;
  transform: translate(-50%, -50%);
  z-index: 1;
  transition: width 0.3s, height 0.3s;
  mix-blend-mode: screen;
  filter: blur(40px);
}

a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{width:min(var(--page),calc(100% - 48px));margin:auto;position:relative;z-index:2}
.mono{font-family:var(--mono);text-transform:uppercase;letter-spacing:.08em;font-size:13px}
.muted{color:var(--muted)}

.eyebrow{display:flex;gap:12px;align-items:center;color:var(--cyan)}
.eyebrow:before{content:"";width:26px;height:1px;background:currentColor}

.topbar{position:sticky;top:0;z-index:30;background:rgba(11,11,14,.85);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.nav{height:74px;display:flex;align-items:center;justify-content:space-between;gap:24px}
.brand{display:flex;align-items:center;gap:12px;font-family:var(--mono);font-size:14px;letter-spacing:.09em}
.brand-mark{width:72px;height:64px;display:grid;place-items:center;flex:none}
.brand-mark img{display:block;width:100%;height:100%;object-fit:contain}
.brand-mark2 {
  width: 172px;
  height: 164px;
  display: flex;
  justify-content: flex-end;
  align-items: center;
  flex: none;
}
.brand-mark2 img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.navlinks{display:flex;gap:30px;align-items:center}
.navlinks a{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);transition:color .2s}
.navlinks a:hover,.navlinks a.active{color:var(--cyan)}

.nav-cta,.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:14px;
  padding:13px 17px;border:1px solid var(--ink);font-size:11px;
  letter-spacing:.1em;text-transform:uppercase;background:transparent;
  transition:background .2s,color .2s,border-color .2s;
}
.nav-cta:hover,.btn:hover{background:var(--acid);color:#101010;border-color:var(--acid)}
.menu-toggle{display:none;background:none;border:1px solid var(--line);padding:10px}

/* HERO SECTION */
.hero{min-height:680px;padding:80px 0 54px;display:grid;align-items:center;position:relative;overflow:hidden}
.hero-grid{display:grid;grid-template-columns:1.08fr .92fr;gap:6%;align-items:center}
.hero h1{font-family:var(--display);font-weight:500;font-size:clamp(58px,9vw,132px);line-height:.82;letter-spacing:-.075em;margin:28px 0 28px;text-transform:uppercase}
.hero h1 span{display:block;color:transparent;-webkit-text-stroke:1px var(--ink)}
.hero h1 .glitch{color:var(--cyan);-webkit-text-stroke:0;text-shadow:3px 0 var(--pink),-2px 0 var(--orange)}
.hero-copy{max-width:450px;font-size:16px;line-height:1.7;color:#b6b4ae}
.hero-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
.btn-primary{background:var(--cyan);border-color:var(--cyan);color:#101010}
.hero-art{position:relative;aspect-ratio: .88;min-height:390px;border:1px solid #4a4a46;background:linear-gradient(135deg,rgba(80,232,242,.15),transparent 40%),linear-gradient(25deg,#171717 20%,#292323 48%,#30202d 70%,#131313);overflow:hidden}
.hero-art:before{content:"";position:absolute;inset:0;background:linear-gradient(125deg,transparent 25%,rgba(255,57,140,.24) 48%,transparent 58%),repeating-linear-gradient(90deg,transparent 0 45px,rgba(255,255,255,.05) 46px 47px)}
.hero-art:after{content:"REC ● 00:00:18:24\A FPV / VLC / 2026";white-space:pre;position:absolute;left:20px;top:18px;font:11px/1.8 var(--mono);color:var(--acid);letter-spacing:.1em}
.orb{position:absolute;width:72%;aspect-ratio:1;border-radius:50%;left:14%;top:18%;background:radial-gradient(circle at 35% 30%,#f4ffff 0 1%,#4de8ef 5%,#3d4dba 20%,#fa3e8b 39%,#ff6b32 50%,transparent 69%);filter:blur(7px);opacity:.85;mix-blend-mode:screen;animation:float 8s ease-in-out infinite}
.drone-ring{position:absolute;width:54%;aspect-ratio:1;left:23%;top:27%;border:1px solid rgba(255,255,255,.75);border-radius:50%;transform:rotate(-28deg)}
.drone-ring:before,.drone-ring:after{content:"";position:absolute;width:140%;height:1px;background:rgba(255,255,255,.65);left:-20%;top:50%;transform:rotate(35deg)}
.drone-ring:after{transform:rotate(-35deg)}

.drone-img {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 70%;
  height: auto;
  z-index: 3;
  object-fit: contain;
  filter: drop-shadow(0 15px 25px rgba(0, 0, 0, 0.7)) drop-shadow(0 0 20px rgba(76, 229, 255, 0.3));
  animation: floatDrone 6s ease-in-out infinite;
}

@keyframes floatDrone {
  0%, 100% { transform: translate(-50%, -50%) translateY(0) rotate(0deg); }
  50% { transform: translate(-50%, -50%) translateY(-12px) rotate(2deg); }
}
@keyframes float{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-15px) scale(1.05)}}

.art-label{position:absolute;right:16px;bottom:16px;font:11px/1.8 var(--mono);text-align:right;color:var(--ink);z-index:4}
.art-label strong{display:block;font-size:18px;color:var(--cyan);font-weight:400}

/* TICKER */
.ticker {
  border-block: 1px solid var(--line);
  overflow: hidden;
  padding: 14px 0;
  color: var(--acid);
  font: 13px var(--mono);
  letter-spacing: .16em;
  white-space: nowrap;
  background: rgba(0,0,0,0.3);
  backdrop-filter: blur(4px);
}
.ticker-track {
  display: flex;
  gap: 32px;
  width: max-content;
  animation: marquee 25s linear infinite;
}
.ticker b { font-weight: 400; color: var(--pink); }
@keyframes marquee {
  0% { transform: translateX(0); }
  100% { transform: translateX(-30%); }
}

/* SECTIONS */
section{padding:110px 0}
.section-head{display:flex;justify-content:space-between;align-items:end;gap:30px;margin-bottom:42px}
.section-head h2{font-family:var(--display);font-size:clamp(40px,6vw,76px);font-weight:400;letter-spacing:-.05em;text-transform:uppercase;line-height:.9;margin:15px 0 0}
.section-head p{max-width:350px;color:var(--muted);font-size:14px;line-height:1.7;margin:0}

.work{background:#0e0e12}

/* FILTERS & SLIDER */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.filter{background:none;border:1px solid var(--line);padding:9px 12px;color:var(--muted);font:11px var(--mono);text-transform:uppercase;letter-spacing:.08em}
.filter.active,.filter:hover{border-color:var(--cyan);color:var(--cyan)}

.slider{position:relative}
.slides{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.video-card{border:1px solid var(--line);background:var(--panel);transition:transform .3s,border-color .3s}

/* MODAL FLOTANTE */
.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.92);
  z-index: 50;
  display: none;
  place-items: center;
  padding: 24px;
}
.modal.open {
  display: grid;
}
.modal-inner {
  width: min(900px, 100%);
  position: relative;
}
.modal-screen {
  aspect-ratio: 16/9;
  border: 1px solid var(--line);
  display: grid;
  place-items: center;
  background: #000;
  overflow: hidden;
}
.modal-close {
  position: absolute;
  right: 0;
  top: -45px;
  background: none;
  border: 1px solid var(--muted);
  padding: 10px 14px;
  font: 11px var(--mono);
  color: var(--ink);
  cursor: pointer;
}
.modal-close:hover {
  border-color: var(--cyan);
  color: var(--cyan);
}

/* Zoom específico para adaptar formatos especiales al modal */
#modalVideo.zoom-fit {
  transform: scale(1.6);
  object-fit: cover !important;
}

/* ==========================================================================
   TARJETAS DE VÍDEO Y CAPAS MULTIMEDIA (LLADRÓN VLC)
   ========================================================================== */
.thumb {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 9;
  overflow: hidden !important;
  cursor: pointer;
  background: #000;
}

.thumb-img,
.thumb-overlay,
.index,
.play {
  pointer-events: none;
}

.thumb-img {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  object-fit: cover !important;
  z-index: 2;
  transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s ease;
}

.thumb:hover .thumb-img {
  transform: scale(1.05);
}

.video-info{padding:18px}
.video-info .meta{display:flex;justify-content:space-between;color:var(--cyan);font:11px var(--mono);text-transform:uppercase}
.video-info h3{font-size:19px;font-weight:400;margin:12px 0 6px;letter-spacing:-.02em}
.video-info p{font-size:12px;color:var(--muted);margin:0;line-height:1.6}

.slider-controls{display:flex;align-items:center;justify-content:space-between;margin-top:24px}
.arrows{display:flex;gap:8px}
.arrow{width:42px;height:42px;border:1px solid var(--line);background:transparent;font-size:18px;transition:border-color .2s, color .2s}
.arrow:hover{border-color:var(--acid);color:var(--acid)}
.placeholder-note{font:11px/1.6 var(--mono);color:var(--muted);margin-top:16px}

/* ABOUT SECTION */
.about-grid{display:grid;grid-template-columns:.8fr 1.2fr;gap:10%;align-items:start}
.about-title{font-family:var(--display);font-size:clamp(40px,5.5vw,72px);font-weight:400;line-height:.92;letter-spacing:-.05em;text-transform:uppercase;margin:18px 0}
.about-title em{font-style:normal;color:var(--pink)}
.about-copy{font-size:16px;line-
